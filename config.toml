baseURL = "https://blog.silencesusuka.com/"

# 多语言配置
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'

[languages]
  [languages.zh-CN]
    languageName = '简体中文'
    weight = 1
    hasCJKLanguage = true
  
   [languages.en]
     languageName = 'English'
     weight = 2
   [languages.zh-TW]
     languageName = '繁體中文'
     weight = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.124.0"

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup.highlight]
guessSyntax = true
noClasses = false